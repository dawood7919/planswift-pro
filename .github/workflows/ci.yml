name: تحقق وبناء Takeoff

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  # Lets a build be requested on demand, so an APK can be produced from any branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  verify-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: takeoff-native-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # Publishes the debug APK as a rolling prerelease so it has a stable, directly
  # downloadable URL. Runs only when a build is requested by hand.
  publish-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: verify-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: takeoff-native-debug-apk
          path: apk
      - name: Publish rolling debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv apk/app-debug.apk apk/takeoff-android-debug.apk
          gh release delete android-debug --yes --cleanup-tag || true
          gh release create android-debug apk/takeoff-android-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Takeoff Android — debug build" \
            --notes "بناء تصحيح غير موقّع من الفرع ${GITHUB_REF_NAME} عند ${GITHUB_SHA}. للتجربة فقط، وليس للنشر على المتجر." \
            --prerelease

